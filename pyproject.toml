[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-motionquery-pose"
version = "0.1.0"
description = "Scene-aware 6DoF head-pose prediction with motion-conditioned anchor memory"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "torch>=2.4,<3"]

[project.scripts]
mqp = "motion_query_pose.cli:main"

[tool.setuptools.packages.find]
include = ["motion_query_pose*"]
